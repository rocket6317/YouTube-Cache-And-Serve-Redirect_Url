<!DOCTYPE html>
<html>
<head>
    <title>Stream Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        input[type="submit"] { padding: 6px 12px; margin-bottom: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        .meta { margin-top: 10px; font-size: 0.9em; color: #555; }
    </style>
</head>
<body>
    <h1>📺 Cached Streams</h1>
    {% if message %}
        <div style="padding: 10px; background-color: #e0ffe0; border: 1px solid #b2d8b2; margin-bottom: 10px;">
            {{ message }}
        </div>
    {% endif %}
    <div class="meta">
        Last updated: {{ last_updated }}<br>
        Next update:
