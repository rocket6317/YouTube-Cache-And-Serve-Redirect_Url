<!DOCTYPE html>
<html>
<head>
    <title>Stream Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; table-layout: fixed; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        th:nth-child(2), td:nth-child(2) {
            width: 40%;
            font-size: 0.85em;
            word-break: break-all;
        }
        input[type="submit"] {
            padding: 6px 12px;
            margin-bottom: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        .meta { margin-top: 10px; font-size: 0.9em; color: #555; }
    </style>
</head>
<body>
    <h1>📺 Cached Streams</h1>

    {% if message %}
        <div style="padding: 10px; background-color: #e0ffe0; border: 1px solid #b2d8b2; margin-bottom: 10px;">
            {{ message }}
        </div>
    {% endif %}

    <form method="POST" action="/dashboard/refresh">
        <input type="submit" value="🔄 Refresh Now">
    </form>

    <div class="meta">
        Last updated: {{ last_updated }}<br>
        Next update: {{ next_update }}
    </div>

    <table>
        <tr>
            <th>Name</th>
            <th>Redirect URL</th>
            <th>Action</th>
        </tr>
        {% for stream in streams %}
        <tr>
            <td>{{ stream.name }}</td>
            <td><a href="/stream?name={{ stream.name }}" target="_blank">{{ stream.m3u8 }}</a></td>
            <td>
                <form method="POST" action="/dashboard/delete" style="display:inline;">
                    <input type="hidden" name="name" value="{{ stream.name }}">
                    <input type="submit" value="Delete">
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

    <p>
        <a href="/dashboard/add">➕ Add New Stream</a> |
        <a href="/dashboard/logs">📊 View Access Logs</a>
    </p>
</body>
</html>
