<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Access Logs</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #e3e3e3; padding: 8px; text-align: left; }
        th { background-color: #f7f7f7; }
    </style>
</head>
<body>
    <h1>📜 Access Logs</h1>
    {% if logs and logs|length > 0 %}
    <table>
        <thead>
            <tr>
                <th>Channel</th>
                <th>Local Handle</th>
                <th>Client IP</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody>
            {% for log in logs %}
            <tr>
                <td>{{ log.channel }}</td>
                <td>{{ log.name }}</td>
                <td>{{ log.ip }}</td>
                <td>{{ log.timestamp }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>No access logs recorded yet.</p>
    {% endif %}
</body>
</html>
