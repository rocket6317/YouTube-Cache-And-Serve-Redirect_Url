<!DOCTYPE html>
<html>
<head>
    <title>Access Logs</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Access Logs</h1>

    <table>
        <thead>
            <tr>
                <th>Stream Name</th>
                <th>IP Address</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody>
            {% for log in logs %}
            <tr>
                <td>{{ log.name }}</td>
                <td>{{ log.ip }}</td>
                <td>{{ log.timestamp }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <p><a href="/dashboard">⬅️ Back to Dashboard</a></p>
</body>
</html>
