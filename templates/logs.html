<!DOCTYPE html>
<html>
<head>
    <title>Access Logs</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Access Logs</h1>
    <p><a href="/dashboard">← Back to Dashboard</a></p>

    {% for channel, ips in logs.items() %}
        <h2>{{ channel }}</h2>
        <table>
            <thead>
                <tr>
                    <th>IP Address</th>
                    <th>Count</th>
                    <th>Last Seen</th>
                </tr>
            </thead>
            <tbody>
                {% for ip, data in ips.items() %}
                <tr>
                    <td>{{ ip }}</td>
                    <td>{{ data.count }}</td>
                    <td>{{ data.last_seen }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% endfor %}
</body>
</html>
