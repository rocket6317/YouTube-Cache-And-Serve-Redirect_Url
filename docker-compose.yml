version: "3.9"

services:
  youtube-redirector:
    image: ghcr.io/rocket6317/youtube-cache-and-serve-redirect-url:latest
    container_name: youtube-redirector
    ports:
      - "6095:6095"
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - YTDLP_EXTERNAL_JS=1
      - PUBLIC_STREAM_BASE_URL=${PUBLIC_STREAM_BASE_URL:-}
      - YOURLS_API_URL=${YOURLS_API_URL:-}
      - YOURLS_USER=${YOURLS_USER:-}
      - YOURLS_PASS=${YOURLS_PASS:-}
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6095/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app_data:
