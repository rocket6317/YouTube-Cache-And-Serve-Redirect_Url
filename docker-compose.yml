version: "3.9"

services:
  youtube-redirector:
    build: .
    container_name: youtube-redirector
    ports:
      - "6095:6095"
    restart: unless-stopped
    environment:
      - YTDLP_EXTERNAL_JS=1
    volumes:
      - ./channels.txt:/app/channels.txt
      - ./db.json:/app/db.json

  youtube-scheduler:
    build: .
    container_name: youtube-scheduler
    restart: unless-stopped
    environment:
      - YTDLP_EXTERNAL_JS=1
    volumes:
      - ./channels.txt:/app/channels.txt
      - ./db.json:/app/db.json
    command: python -c "import scheduler; scheduler.start_scheduler()"
