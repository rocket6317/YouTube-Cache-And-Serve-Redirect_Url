version: "3.9"

services:
  youtube-redirector:
    build:
      context: .
    container_name: youtube-redirector
    ports:
      - "6095:6095"
    restart: unless-stopped
    environment:
      - YTDLP_EXTERNAL_JS=1
    volumes:
      - app_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6095/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app_data:
