version: "3.9"

services:
  stream-redirector:
    build: .
    container_name: stream-redirector
    ports:
      - "6095:6095"
    restart: unless-stopped
    environment:
      - YTDLP_EXTERNAL_JS=1
    volumes:
      - ./channels.txt:/app/channels.txt
      - ./db.json:/app/db.json
      - ./timestamps.txt:/app/timestamps.txt
