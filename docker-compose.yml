version: "3.9"

services:
  youtube-redirector:
    build: .
    container_name: youtube-redirector
    ports:
      - "6095:6095"
    restart: unless-stopped
    environment:
      - YTDLP_EXTERNAL_JS=1
    volumes:
      # Persist TinyDB database and timestamp file
      - youtube_data:/app/streams.json
      - youtube_data:/app/last_update.txt
      # Optional: persist access logs
      - youtube_data:/app/access_log.json

volumes:
  youtube_data:
